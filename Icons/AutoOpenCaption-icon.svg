<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a75c2"/>
      <stop offset="1" stop-color="#003b66"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#9fd3f5"/>
    </linearGradient>
    <linearGradient id="hl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd84a"/>
      <stop offset="1" stop-color="#ffb800"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#001a30" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- app tile -->
  <rect x="32" y="32" width="960" height="960" rx="220" fill="url(#bg)"/>
  <rect x="32" y="32" width="960" height="960" rx="220" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="4"/>

  <!-- waveform (audio in) -->
  <g fill="url(#wave)">
    <rect x="198" y="352" width="46" height="120" rx="23"/>
    <rect x="272" y="290" width="46" height="244" rx="23"/>
    <rect x="346" y="226" width="46" height="372" rx="23"/>
    <rect x="420" y="300" width="46" height="224" rx="23"/>
    <rect x="494" y="190" width="46" height="444" rx="23"/>
    <rect x="568" y="270" width="46" height="284" rx="23"/>
    <rect x="642" y="236" width="46" height="352" rx="23"/>
    <rect x="716" y="324" width="46" height="176" rx="23"/>
    <rect x="790" y="372" width="46" height="80" rx="23"/>
  </g>

  <!-- caption bar (text out) -->
  <g filter="url(#sh)">
    <rect x="132" y="652" width="760" height="224" rx="56" fill="#001f38" fill-opacity="0.82"/>
  </g>
  <rect x="132" y="652" width="760" height="224" rx="56" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="3"/>

  <!-- caption words: two white, one highlighted -->
  <rect x="188" y="722" width="170" height="84" rx="24" fill="#ffffff"/>
  <rect x="384" y="722" width="248" height="84" rx="24" fill="#ffffff"/>
  <rect x="658" y="708" width="178" height="112" rx="30" fill="url(#hl)"/>
  <rect x="690" y="748" width="114" height="32" rx="16" fill="#003b66" fill-opacity="0.85"/>
</svg>
